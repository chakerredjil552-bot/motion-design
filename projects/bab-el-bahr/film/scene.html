<!doctype html>
<html><head><meta charset="utf-8"><title>Bab El Bahr</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Bab El Bahr — 20 s, 1920x1080, rendered frame by frame at 60 fps.
// renderFrame(t) paints the frame at time t (seconds). Deterministic.
const W = 1920, H = 1080;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

// ---------- helpers ----------
function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const INK = '#1d1622';

function vgrad(c, y0, y1, stops) { const g = c.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function sky(c, stops) { c.fillStyle = vgrad(c, 0, H, stops); c.fillRect(0, 0, W, H); }
function glow(c, x, y, r, rgb, a = 1, core = true) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  if (core) g.addColorStop(0, `rgba(255,255,246,${a})`);
  g.addColorStop(core ? .06 : 0, `rgba(${rgb},${.85 * a})`);
  g.addColorStop(.3, `rgba(${rgb},${.28 * a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r);
}
// god rays from a point
function rays(c, x, y, n, len, seed, rgb, a, spread = Math.PI * 2, dir = 0, t = 0) {
  const R = rng(seed); c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const ang = dir + (R() - .5) * spread + Math.sin(t * .4 + i) * .01;
    const w = .01 + R() * .035, L = len * (.5 + R() * .7);
    const g = c.createRadialGradient(x, y, 0, x, y, L);
    const al = a * (.4 + R() * .6) * (.75 + .25 * Math.sin(t * 1.3 + i * 2.1));
    g.addColorStop(0, `rgba(${rgb},${al})`); g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g; c.beginPath(); c.moveTo(x, y);
    c.arc(x, y, L, ang - w, ang + w); c.closePath(); c.fill();
  }
  c.restore();
}
// cel-shaded soft cloud bank, painted into c
function clouds(c, banks, sun) {
  banks.forEach(b => {
    const R = rng(b.seed); const o = mk(); const k = o.getContext('2d');
    const n = Math.floor(b.w / 34) + 5, puffs = [];
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), hump = Math.pow(Math.sin(Math.PI * u), .7);
      const r = (b.h * .25 + b.h * .75 * hump) * (.55 + R() * .5);
      puffs.push([b.x + u * b.w + (R() - .5) * 26, b.y - r * .3 + (R() - .5) * b.h * .15, r]);
    }
    const shape = (dy = 0, sc = 1) => { k.beginPath(); puffs.forEach(([px, py, r]) => { k.moveTo(px + r * sc, py + dy); k.ellipse(px, py + dy, r * sc, r * .6 * sc, 0, 0, 7); }); };
    shape(); k.fillStyle = vgrad(k, b.y - b.h, b.y + b.h * .3, [[0, b.top], [1, b.bot]]); k.fill();
    // shadow tone (2nd cel step)
    k.globalCompositeOperation = 'source-atop';
    shape(b.h * .32, .9); k.fillStyle = b.shade; k.fill();
    // lit rim toward the sun
    const lg = k.createRadialGradient(sun[0], sun[1], 0, sun[0], sun[1], b.lit[1]);
    lg.addColorStop(0, b.lit[0]); lg.addColorStop(1, 'rgba(255,255,255,0)');
    k.fillStyle = lg; k.fillRect(0, 0, W, H);
    // flat bottom
    k.globalCompositeOperation = 'destination-out';
    k.fillStyle = vgrad(k, b.y + b.h * .05, b.y + b.h * .35, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,1)']]);
    k.fillRect(0, b.y, W, H);
    c.save(); c.globalAlpha = b.alpha ?? 1; c.filter = 'blur(1.2px)'; c.drawImage(o, 0, 0); c.restore();
  });
}
// rim-lit silhouette: draw(k, color) paints the shape
const rimTmp = mk();
function rimShape(c, draw, dark, rim, dx, dy, glowA = .35) {
  draw(c, dark);
  const k = rimTmp.getContext('2d'); k.setTransform(1, 0, 0, 1, 0, 0); k.clearRect(0, 0, W, H);
  k.setTransform(c.getTransform());
  draw(k, rim);
  k.globalCompositeOperation = 'destination-out';
  const m = c.getTransform(); k.setTransform(m.a, m.b, m.c, m.d, m.e - dx, m.f - dy);
  draw(k, '#000');
  k.globalCompositeOperation = 'source-over'; k.setTransform(1, 0, 0, 1, 0, 0);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'lighter'; c.globalAlpha = glowA; c.filter = 'blur(10px)'; c.drawImage(rimTmp, 0, 0);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.filter = 'none'; c.drawImage(rimTmp, 0, 0);
  c.restore();
}
function ink(c, w = 1.4, a = .8) { c.strokeStyle = `rgba(29,22,34,${a})`; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round'; }
function cam(c, fx, fy, s, rot = 0) { c.translate(fx, fy); c.rotate(rot); c.scale(s, s); c.translate(-fx, -fy); }

// jasmine petals / dust
function petals(c, t, n, seed, opt) {
  const R = rng(seed);
  for (let i = 0; i < n; i++) {
    const sp = opt.speed * (.6 + R() * .8), ph = R() * 100, sz = opt.size * (.5 + R());
    const x = ((R() * (W + 400) + t * sp) % (W + 400)) - 200;
    const y = R() * H + Math.sin(t * 1.7 + ph) * 40 + t * opt.fall * (.5 + R());
    const yy = ((y % (H + 200)) + H + 200) % (H + 200) - 100;
    const rot = t * (2 + R() * 3) + ph, flip = Math.cos(t * 3 + ph);
    c.save(); c.translate(x, yy); c.rotate(rot); c.scale(1, Math.abs(flip) * .8 + .2);
    if (opt.blur) c.filter = `blur(${opt.blur * (R() > .7 ? 2.5 : .3)}px)`;
    c.fillStyle = opt.color; c.beginPath();
    for (let p = 0; p < 5; p++) { const a = p / 5 * Math.PI * 2; c.moveTo(0, 0); c.quadraticCurveTo(Math.cos(a - .5) * sz * 1.2, Math.sin(a - .5) * sz * 1.2, Math.cos(a) * sz, Math.sin(a) * sz); c.quadraticCurveTo(Math.cos(a + .5) * sz * 1.2, Math.sin(a + .5) * sz * 1.2, 0, 0); }
    c.fill(); c.fillStyle = 'rgba(255,214,120,.9)'; c.beginPath(); c.arc(0, 0, sz * .18, 0, 7); c.fill();
    c.restore();
  }
}
function dust(c, t, n, seed, region, rgb) {
  const R = rng(seed); c.save(); c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const x = region[0] + ((R() * region[2] + t * (10 + R() * 25)) % region[2]);
    const y = region[1] + ((R() * region[3] + Math.sin(t + i) * 12 - t * (4 + R() * 8)) % region[3] + region[3]) % region[3];
    const r = .8 + R() * 2.4, a = .25 + .5 * (.5 + .5 * Math.sin(t * 2 + i));
    c.fillStyle = `rgba(${rgb},${a})`; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  c.restore();
}
function gull(c, x, y, s, t, ph) {
  const f = Math.sin(t * 7 + ph); c.save(); c.translate(x, y); c.scale(s, s);
  c.beginPath(); c.moveTo(-30, -6 - f * 12); c.quadraticCurveTo(-14, -14 - f * 6, 0, 0); c.quadraticCurveTo(14, -14 - f * 6, 30, -6 - f * 12);
  c.quadraticCurveTo(14, -6 - f * 3, 0, 4); c.quadraticCurveTo(-14, -6 - f * 3, -30, -6 - f * 12);
  c.fillStyle = '#f7f1ea'; c.fill(); ink(c, 1.2 / s, .7); c.stroke(); c.restore();
}

// ---------- shared painted assets ----------
// white city of Algiers on a hillside
function paintCity(c, seed, o) {
  const R = rng(seed);
  const hill = x => o.top + (o.base - o.top) * Math.pow(clamp(x / o.shore), 1.6);
  // hill ground
  c.beginPath(); c.moveTo(0, H); c.lineTo(0, hill(0));
  for (let x = 0; x <= o.shore; x += 20) c.lineTo(x, hill(x) - 8);
  c.lineTo(o.shore + 60, o.base + 30); c.lineTo(o.shore + 60, H); c.closePath();
  c.fillStyle = '#8f9a8a'; c.fill();
  const bs = [];
  for (let i = 0; i < o.count; i++) {
    const x = R() * o.shore * 1.02 - 30;
    const y = hill(x) + R() * (H - hill(x)) * .95;
    const d = (y - o.top) / (H - o.top);
    const sc = .55 + d * .9;
    bs.push({ x, y, w: (22 + R() * 46) * sc, h: (18 + R() * 40) * sc, d, r: R(), r2: R(), r3: R() });
  }
  bs.sort((a, b) => a.y - b.y);
  bs.forEach(b => {
    const { x, y, w, h, d } = b, side = w * .18;
    const shadowAmt = clamp((d - .25) * 1.2);
    const front = `rgb(${lerp(246, 150, shadowAmt)},${lerp(238, 178, shadowAmt)},${lerp(228, 190, shadowAmt)})`;
    const lit = `rgb(${lerp(255, 190, shadowAmt)},${lerp(214, 196, shadowAmt)},${lerp(178, 200, shadowAmt)})`;
    c.fillStyle = front; c.fillRect(x, y - h, w, h);
    c.fillStyle = lit; c.beginPath(); c.moveTo(x + w, y - h); c.lineTo(x + w + side, y - h - side * .45); c.lineTo(x + w + side, y - side * .45); c.lineTo(x + w, y); c.fill();
    // roof parapet
    c.fillStyle = `rgba(255,248,236,${.8 - shadowAmt * .5})`; c.fillRect(x - 1, y - h - 2, w + 2, 3);
    // windows with blue shutters
    const rows = Math.max(1, Math.floor(h / 16)), cols = Math.max(1, Math.floor(w / 15));
    for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) {
      if (((b.r * 97 + r * 13 + q * 7) % 1) > .78) continue;
      const wx = x + 4 + q * (w - 8) / cols, wy = y - h + 5 + r * (h - 8) / rows, ww = Math.max(2, (w - 8) / cols * .45), wh = Math.max(3, (h - 8) / rows * .5);
      c.fillStyle = shadowAmt > .5 ? '#3d6478' : '#6fa3c8'; c.fillRect(wx, wy, ww, wh);
      c.fillStyle = 'rgba(20,30,50,.5)'; c.fillRect(wx + ww * .35, wy, ww * .3, wh);
    }
    if (b.r2 > .82 && w > 30) { // arch door
      c.fillStyle = '#4a7f9a'; c.beginPath(); c.moveTo(x + w * .4, y); c.lineTo(x + w * .4, y - h * .3); c.arc(x + w * .5, y - h * .3, w * .1, Math.PI, 0); c.lineTo(x + w * .6, y); c.fill();
    }
    if (b.r3 > .9) { // laundry line on roof
      c.strokeStyle = 'rgba(60,50,50,.5)'; c.lineWidth = .8; c.beginPath(); c.moveTo(x + 3, y - h - 8); c.lineTo(x + w - 3, y - h - 8); c.stroke();
      ['#e46a5a', '#f5f0e0', '#5d8fd0'].forEach((col, j) => { c.fillStyle = col; c.fillRect(x + 6 + j * w * .28, y - h - 8, w * .16, 7); });
    }
    ink(c, .9, .45 + shadowAmt * .2); c.strokeRect(x, y - h, w, h);
  });
  // landmark: dome and square minaret near the hilltop
  const mx = o.shore * .32, my = hill(mx) + 30;
  c.fillStyle = '#fbf3e6'; c.fillRect(mx - 14, my - 150, 28, 150);
  c.fillStyle = '#ffd7ae'; c.fillRect(mx + 14, my - 150, 6, 150);
  c.fillStyle = '#fbf3e6'; c.fillRect(mx - 9, my - 178, 18, 28);
  c.fillStyle = '#5a8f6a'; c.beginPath(); c.moveTo(mx - 9, my - 178); c.lineTo(mx, my - 196); c.lineTo(mx + 9, my - 178); c.fill();
  for (let i = 0; i < 4; i++) { c.fillStyle = '#6fa3c8'; c.fillRect(mx - 4, my - 140 + i * 30, 8, 14); }
  ink(c, 1, .6); c.strokeRect(mx - 14, my - 150, 28, 150);
  const dx = mx + 90, dy = my + 10;
  c.fillStyle = '#fbf3e6'; c.fillRect(dx - 50, dy - 40, 100, 40);
  c.beginPath(); c.ellipse(dx, dy - 40, 44, 38, 0, Math.PI, 0); c.fillStyle = '#f7efe2'; c.fill();
  c.beginPath(); c.ellipse(dx + 6, dy - 40, 36, 34, 0, Math.PI * 1.5, 0); c.fillStyle = '#ffd9b4'; c.fill();
  ink(c, 1, .6); c.beginPath(); c.ellipse(dx, dy - 40, 44, 38, 0, Math.PI, 0); c.stroke(); c.strokeRect(dx - 50, dy - 40, 100, 40);
  // lower streets still in teal shadow, first sun on top rows
  c.save(); c.globalCompositeOperation = 'source-atop';
  c.fillStyle = vgrad(c, o.top, H, [[0, 'rgba(255,190,140,.18)'], [.35, 'rgba(47,88,102,0)'], [1, 'rgba(30,62,80,.55)']]);
  c.fillRect(0, 0, W, H); c.restore();
}

// boxy unbranded yellow taxi, side view, facing right (dir=1) or left (-1)
function taxi(c, x, y, s, dir = 1, opts = {}) {
  c.save(); c.translate(x, y); c.scale(s * dir, s);
  const bounce = opts.bounce || 0; c.translate(0, bounce);
  ink(c, 3 / s * Math.max(1, s), .95); c.lineWidth = 3;
  // body
  c.beginPath(); c.moveTo(-200, -30); c.lineTo(-195, -78); c.lineTo(-120, -88); c.lineTo(-80, -140); c.lineTo(70, -142); c.lineTo(120, -90); c.lineTo(196, -80); c.lineTo(204, -30); c.lineTo(200, -10); c.lineTo(-200, -10); c.closePath();
  c.fillStyle = '#f2c230'; c.fill();
  c.save(); c.clip(); c.fillStyle = '#c48e1c'; c.fillRect(-210, -52, 420, 60);
  c.fillStyle = 'rgba(255,240,170,.8)'; c.fillRect(-210, -88, 420, 6); c.restore();
  c.stroke();
  // windows
  c.beginPath(); c.moveTo(-108, -90); c.lineTo(-74, -132); c.lineTo(-8, -133); c.lineTo(-8, -90); c.closePath();
  c.moveTo(4, -90); c.lineTo(4, -134); c.lineTo(64, -134); c.lineTo(106, -90); c.closePath();
  c.fillStyle = opts.glass || '#3f6f80'; c.fill(); c.stroke();
  c.save(); c.clip(); c.fillStyle = 'rgba(255,230,200,.35)'; c.beginPath(); c.moveTo(-60, -140); c.lineTo(-30, -140); c.lineTo(-70, -80); c.lineTo(-100, -80); c.fill();
  if (opts.driver) { c.fillStyle = '#1e1a22'; c.beginPath(); c.ellipse(36, -104, 16, 18, 0, 0, 7); c.fill(); c.fillRect(22, -126, 32, 10); c.fillRect(14, -92, 50, 10); }
  c.restore();
  // roof sign (no text)
  c.fillStyle = '#fbf6ea'; c.fillRect(-30, -158, 60, 16); c.strokeRect(-30, -158, 60, 16);
  // door lines + dent
  c.beginPath(); c.moveTo(-2, -138); c.lineTo(-4, -14); c.moveTo(-112, -86); c.lineTo(-114, -16); c.stroke();
  c.lineWidth = 1.6; c.beginPath(); c.moveTo(-80, -50); c.quadraticCurveTo(-64, -42, -50, -52); c.stroke();
  // bumpers + lights
  c.fillStyle = '#9a9a96'; c.fillRect(-212, -30, 24, 14); c.fillRect(188, -30, 24, 14);
  c.fillStyle = '#fff4c8'; c.fillRect(190, -66, 12, 12); c.fillStyle = '#d0402a'; c.fillRect(-202, -66, 8, 14);
  // wheels
  const wr = opts.wheelRot || 0;
  [-130, 130].forEach(wx => {
    c.fillStyle = '#211d22'; c.beginPath(); c.arc(wx, -10, 38, 0, 7); c.fill();
    c.fillStyle = '#a6a39c'; c.beginPath(); c.arc(wx, -10, 18, 0, 7); c.fill();
    c.strokeStyle = '#5a5650'; c.lineWidth = 3; c.beginPath();
    for (let i = 0; i < 4; i++) { const a = wr + i * Math.PI / 2; c.moveTo(wx, -10); c.lineTo(wx + Math.cos(a) * 16, -10 + Math.sin(a) * 16); }
    c.stroke();
  });
  c.restore();
}

// amber prayer beads hanging from a point; theta = swing angle
function beads(c, x, y, s, theta, t, glint = 0) {
  c.save(); c.translate(x, y); c.rotate(theta); c.scale(s, s);
  // loop of beads (catenary-ish U)
  const pts = [];
  for (let i = 0; i < 30; i++) { const u = i / 29; const a = Math.PI * (1 - u); pts.push([Math.cos(a) * 38 + Math.sin(u * 9 + t) * .6, Math.sin(a) * 0 + Math.sin(Math.PI * u) * 150]); }
  c.strokeStyle = '#3a2614'; c.lineWidth = 1.2; c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.stroke();
  // lower strand + tassel
  const lag = Math.sin(t * 2.6 - .6) * .25;
  const sx = 0, sy = 150;
  const drawBead = (bx, by, r) => {
    const g = c.createRadialGradient(bx - r * .35, by - r * .35, r * .1, bx, by, r);
    g.addColorStop(0, '#fff0b0'); g.addColorStop(.35, '#f0a83c'); g.addColorStop(1, '#7a3c0c');
    c.fillStyle = g; c.beginPath(); c.arc(bx, by, r, 0, 7); c.fill();
    c.strokeStyle = 'rgba(40,20,8,.8)'; c.lineWidth = .9; c.stroke();
  };
  pts.forEach(([px, py], i) => { if (i % 1 === 0) drawBead(px, py, 5.6); });
  c.save(); c.translate(sx, sy); c.rotate(lag);
  c.strokeStyle = '#3a2614'; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 40); c.stroke();
  drawBead(0, 12, 6); drawBead(0, 26, 6.5); drawBead(0, 40, 7.5);
  c.fillStyle = '#c99a3a'; c.fillRect(-5, 46, 10, 7);
  c.save(); c.translate(0, 53); c.rotate(lag * .8);
  for (let i = 0; i < 16; i++) { const a = (i / 15 - .5) * .5; c.strokeStyle = i % 3 ? '#2f5a3a' : '#467a52'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(Math.sin(a) * 20, 25, Math.sin(a) * 30 + Math.sin(t * 3 + i) * 1.5, 52); c.stroke(); }
  c.restore(); c.restore();
  if (glint > 0) {
    const [gx, gy] = pts[19];
    c.save(); c.globalCompositeOperation = 'lighter';
    const L = 120 * glint;
    [[0, 1], [Math.PI / 2, .7], [Math.PI / 4, .35], [-Math.PI / 4, .35]].forEach(([a, k]) => {
      const g = c.createLinearGradient(gx - Math.cos(a) * L * k, gy - Math.sin(a) * L * k, gx + Math.cos(a) * L * k, gy + Math.sin(a) * L * k);
      g.addColorStop(0, 'rgba(255,220,150,0)'); g.addColorStop(.5, `rgba(255,250,230,${glint})`); g.addColorStop(1, 'rgba(255,220,150,0)');
      c.strokeStyle = g; c.lineWidth = 3; c.beginPath(); c.moveTo(gx - Math.cos(a) * L * k, gy - Math.sin(a) * L * k); c.lineTo(gx + Math.cos(a) * L * k, gy + Math.sin(a) * L * k); c.stroke();
    });
    glow(c, gx, gy, 60 * glint, '255,200,120', glint);
    c.restore();
  }
  c.restore();
}

// anime eyes, drawn around (cx, cy). who: 'selma' | 'hamid'
function eyes(c, cx, cy, s, look, blink, who, wet = 0) {
  c.save(); c.translate(cx, cy); c.scale(s, s);
  const H_ = who === 'selma';
  [-1, 1].forEach(side => {
    c.save(); c.translate(side * 150, 0); if (side < 0) c.scale(-1, 1);
    const open = 1 - blink, eh = (H_ ? 46 : 30) * open + 2;
    // eye white
    c.beginPath(); c.moveTo(-70, 4); c.bezierCurveTo(-40, -eh, 40, -eh * 1.05, 76, -4); c.bezierCurveTo(40, eh * .55, -40, eh * .6, -70, 4); c.closePath();
    c.fillStyle = '#fbf6f2'; c.fill();
    c.save(); c.clip();
    c.fillStyle = 'rgba(150,120,140,.35)'; c.fillRect(-80, -60, 170, eh * .45 + 10 - 48 + 48 * .3);
    // iris
    const ix = (side < 0 ? -look : look) * 22, iy = H_ ? 2 : 6, ir = H_ ? 34 : 26;
    const ig = c.createRadialGradient(ix, iy + 8, 2, ix, iy, ir);
    if (H_) { ig.addColorStop(0, '#c9cf86'); ig.addColorStop(.45, '#7a8b4e'); ig.addColorStop(1, '#2e3a1c'); }
    else { ig.addColorStop(0, '#9a6a40'); ig.addColorStop(.5, '#5a3820'); ig.addColorStop(1, '#22140c'); }
    c.fillStyle = ig; c.beginPath(); c.ellipse(ix, iy, ir * .88, ir * 1.1, 0, 0, 7); c.fill();
    c.fillStyle = '#120c10'; c.beginPath(); c.ellipse(ix, iy, ir * .36, ir * .48, 0, 0, 7); c.fill();
    c.strokeStyle = 'rgba(18,12,16,.85)'; c.lineWidth = 2.4; c.beginPath(); c.ellipse(ix, iy, ir * .88, ir * 1.1, 0, 0, 7); c.stroke();
    // lid shadow

  const mouth = 8 * (sstep(10.8, 11.1, t) - sstep(11.5, 11.9, t));
  const tremble = Math.sin(t * 60) * 2 * (sstep(11.85, 11.9, t) - sstep(12.15, 12.2, t));
  ctx.save(); ctx.translate(1290 - lean * 70, 470 + lean * 10); ctx.scale(1.12, 1.12);
  rimShape(ctx, (k, col) => selmaProfile(k, col, { mouth, t: u }), '#22161e', '#ffbd7a', 6, -3, .5); ctx.restore();
  ctx.save(); ctx.translate(560, 420); ctx.scale(1.1, 1.1);
  rimShape(ctx, (k, col) => hamidProfile(k, col, { tremble }), '#1d141a', '#ffb070', -6, -3, .5);
  // a wet glint in his eye
  const wet = sstep(12.2, 12.6, t);
  if (wet > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, -76, 122, 14, '255,230,200', wet); ctx.restore(); }
  ctx.restore();
  ctx.restore();
}

function shot5(t) { // 13-17s the beads change hands, impact, whip pan, plane
  const u = t - 13;
  const drawHands = (impact) => {
    const z = 1 + .08 * ease(u / 2);
    ctx.save(); cam(ctx, 1000, 760, z);
    const lower = easeOut(sstep(13.0, 13.9, t)), wrap = ease(sstep(13.8, 14.7, t));
    const trem = Math.sin(t * 40) * 1.2 * sstep(14.6, 14.7, t);
    const herCol = impact ? '#000' : '#3a221c', hisCol = impact ? '#000' : '#2a1914';
    // beads hanging from his fingers, then lying in her palm
    const hx = lerp(lerp(900, 980, lower), 1060, wrap), hy = lerp(lerp(160, 420, lower), 760, wrap) + trem, hr = lerp(-.2, .15, wrap);
    if (impact) {
      herHand(ctx, herCol, { curl: lerp(.15, .85, wrap) });
      hisHand(ctx, hisCol, { x: hx, y: hy, rot: hr, curl: lerp(.2, .9, wrap) });
    } else {
      rimShape(ctx, (k, col) => herHand(k, col, { curl: lerp(.15, .85, wrap) }), herCol, '#ffc58a', 7, -6, .6);
      // beads hang from his fingertips, glowing against her palm
      if (wrap < .97) { const ax = hx + Math.cos(hr) * 150 - Math.sin(hr) * 20, ay = hy + Math.sin(hr) * 150 + Math.cos(hr) * 20;
        ctx.save(); ctx.globalAlpha = 1 - sstep(.8, .97, wrap); beads(ctx, ax, ay, .95, Math.sin(t * 3.2) * .12 * (1 - lower) + .05, t, sstep(13.9, 14.1, t) * (1 - sstep(14.1, 14.4, t)) * .8); ctx.restore(); }
      rimShape(ctx, (k, col) => hisHand(k, col, { x: hx, y: hy, rot: hr, curl: lerp(.2, .9, wrap) }), hisCol, '#ffb46e', 7, -6, .6);
    }
    // tassel escaping between the fingers once closed
    if (!impact && wrap > .85) {
      ctx.save(); ctx.translate(1110, 840); ctx.rotate(Math.sin(t * 4) * .15 + .3);
      for (let i = 0; i < 14; i++) { const a = (i / 13 - .5) * .5; ctx.strokeStyle = i % 3 ? '#2f5a3a' : '#5a8f66'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(Math.sin(a) * 20, 30, Math.sin(a) * 34 + Math.sin(t * 5 + i) * 3, 70); ctx.stroke(); }
      ctx.fillStyle = '#e0952f'; ctx.beginPath(); ctx.arc(-6, -6, 8, 0, 7); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  };
  if (t < 15) {
    ctx.save(); ctx.filter = 'blur(10px)'; ctx.drawImage(A.s5sky, -60, -60, W + 120, H + 120);
    // blurred airport terminal + yellow taxi at the left edge
    ctx.fillStyle = 'rgba(200,170,170,.7)'; ctx.fillRect(0, 760, W, 400);
    ctx.fillStyle = 'rgba(240,220,210,.8)'; for (let i = 0; i < 12; i++) ctx.fillRect(i * 170, 700, 120, 40);
    ctx.fillStyle = '#f2c230'; ctx.fillRect(-100, 740, 420, 400);
    ctx.restore();
    glow(ctx, 1500, 300, 400, '255,226,180', 1);
    rays(ctx, 1500, 300, 30, 1600, 55, '255,226,180', .07, Math.PI * .9, Math.PI * .75, t);
    drawHands(false);
    petals(ctx, t * 1.6, 40, 21, { speed: 420, fall: 60, size: 10, color: '#fffaf2', blur: 1.5 });
    return;
  }
  if (t < 15.067) { // impact frame: stark graphic
    ctx.fillStyle = t < 15.034 ? '#e8452c' : '#f6efe2'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.strokeStyle = t < 15.034 ? '#fff4e0' : '#e8452c';
    const R = rng(3); for (let i = 0; i < 90; i++) { const a = R() * Math.PI * 2, r0 = 260 + R() * 200; ctx.lineWidth = 2 + R() * 10; ctx.beginPath(); ctx.moveTo(1050 + Math.cos(a) * r0, 800 + Math.sin(a) * r0); ctx.lineTo(1050 + Math.cos(a) * 2400, 800 + Math.sin(a) * 2400); ctx.stroke(); }
    ctx.restore();
    drawHands(true);
    return;
  }
  // whip pan up into the sky, then the plane climbing
  const wp = ease(sstep(15.067, 15.45, t));
  const sceneSky = (yo) => {
    ctx.save(); ctx.translate(0, yo); ctx.drawImage(A.s5sky, 0, 0);
    glow(ctx, 1500, 300, 260, '255,236,200', 1);
    rays(ctx, 1500, 300, 30, 1600, 56, '255,226,180', .06, Math.PI * 2, 0, t);
    const pu = clamp((t - 15.2) / 1.8); const px = lerp(300, 1500, pu), py = lerp(820, 380, pu);
    // contrail
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px - 120, py + 50); ctx.lineTo(lerp(-200, px - 120, .2), lerp(1100, py + 50, .2)); ctx.stroke();
    plane(ctx, px, py, .95 + pu * .1, -.38);
    ctx.restore();
  };
  if (wp < 1) {
    // smear: stacked offset copies
    for (let k = 0; k < 10; k++) { ctx.globalAlpha = k ? .16 : 1; sceneSky(-H + wp * H + k * 40 * (1 - wp)); }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.globalAlpha = .6 * (1 - wp); ctx.strokeStyle = '#fff'; const R = rng(9);
    for (let i = 0; i < 60; i++) { ctx.lineWidth = 2 + R() * 6; const x = R() * W; ctx.beginPath(); ctx.moveTo(x, R() * H); ctx.lineTo(x, R() * H + 400); ctx.stroke(); }
    ctx.restore();
  } else sceneSky(0);
  petals(ctx, t * 1.6, 30, 22, { speed: 380, fall: 50, size: 12, color: '#fffaf2', blur: 2 });
}
function plane(c, x, y, s, rot) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  ink(c, 2.4, .9);
  c.fillStyle = '#c9cdd6'; c.beginPath(); c.moveTo(-40, 6); c.lineTo(60, 70); c.lineTo(84, 70); c.lineTo(40, 6); c.closePath(); c.fill(); c.stroke(); // far wing
  c.fillStyle = '#f6f4f0'; c.beginPath(); c.moveTo(-170, -6); c.bezierCurveTo(-150, -22, 120, -24, 160, -14); c.bezierCurveTo(186, -8, 190, 6, 170, 12); c.lineTo(-160, 14); c.bezierCurveTo(-176, 10, -180, 0, -170, -6); c.fill(); c.stroke();
  c.fillStyle = '#dfe2e8'; c.fillRect(-150, 4, 310, 9);
  c.fillStyle = '#f6f4f0'; c.beginPath(); c.moveTo(-150, -8); c.lineTo(-190, -80); c.lineTo(-166, -80); c.lineTo(-110, -12); c.fill(); c.stroke(); // tail
  c.fillStyle = '#2f5a3a'; c.beginPath(); c.moveTo(-178, -70); c.lineTo(-190, -80); c.lineTo(-166, -80); c.lineTo(-150, -58); c.fill();
  c.fillStyle = '#e6e8ec'; c.beginPath(); c.moveTo(-30, 4); c.lineTo(50, 4); c.lineTo(-30, 80); c.lineTo(-66, 80); c.closePath(); c.fill(); c.stroke(); // near wing
  c.fillStyle = '#b8bcc6'; c.beginPath(); c.ellipse(-10, 40, 26, 11, 0, 0, 7); c.fill(); c.stroke(); // engine
  c.fillStyle = '#3a4a5a'; for (let i = 0; i < 18; i++) c.fillRect(-120 + i * 14, -8, 6, 6);
  c.fillStyle = '#2b3542'; c.beginPath(); c.moveTo(150, -14); c.lineTo(172, -4); c.lineTo(150, -4); c.fill();
  c.fillStyle = 'rgba(255,220,170,.7)'; c.fillRect(-150, -18, 300, 3);
  c.restore();
}

function shot6(t) { // 17-20s empty mirror, then the taxi by the sea
  const u = t - 17;
  if (t < 19.3) {
    const z = 1.14 - .12 * ease(sstep(18.4, 19.3, t));
    ctx.save(); cam(ctx, 960, 420, z);
    ctx.drawImage(A.s6bay, 0, -40);
    glow(ctx, 1350, 520, 200, '255,236,200', .9);
    // plane climbing far away with contrail
    const pu = clamp(u / 2.3), px = lerp(500, 820, pu), py = lerp(330, 240, pu);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px - 20, py + 8); ctx.lineTo(px - 340, py + 130); ctx.stroke();
    plane(ctx, px, py, .2, -.3);
    // interior frame
    ctx.fillStyle = '#1a1419'; ctx.fillRect(-200, -200, W + 400, 300);
    ctx.beginPath(); ctx.moveTo(-200, 100); ctx.lineTo(220, 100); ctx.lineTo(-200, 900); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W + 200, 100); ctx.lineTo(W - 220, 100); ctx.lineTo(W + 200, 900); ctx.fill();
    ctx.fillStyle = vgrad(ctx, 700, H, [[0, '#4a3226'], [.2, '#2c1e18'], [1, '#120c0a']]);
    ctx.beginPath(); ctx.moveTo(-200, 760); ctx.bezierCurveTo(500, 690, 1400, 690, W + 200, 760); ctx.lineTo(W + 200, H + 200); ctx.lineTo(-200, H + 200); ctx.fill();
    // fading, still-swaying shadow of the beads on the dashboard
    const sw = Math.sin(u * 2.4) * 40 * Math.exp(-u * .9), sa = .35 * (1 - sstep(17.2, 19, t));
    ctx.save(); ctx.filter = 'blur(6px)'; ctx.strokeStyle = `rgba(0,0,0,${sa})`; ctx.lineWidth = 9; ctx.beginPath(); ctx.ellipse(980 + sw, 740, 60, 16, 0, 0, Math.PI); ctx.stroke(); ctx.restore();
    // mirror: bare. In it, Hamid's wet eyes glancing up at the plane
    const mx = 960, my = 230, mw = 470, mh = 150;
    ctx.fillStyle = '#18141a'; ctx.fillRect(mx - 10, 40, 20, 80);
    ctx.beginPath(); ctx.roundRect(mx - mw / 2 - 14, my - mh / 2 - 14, mw + 28, mh + 28, 30); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.roundRect(mx - mw / 2, my - mh / 2, mw, mh, 22); ctx.clip();
    ctx.fillStyle = vgrad(ctx, my - mh / 2, my + mh / 2, [[0, '#d7a27a'], [1, '#b98461']]); ctx.fillRect(mx - mw / 2, my - mh / 2, mw, mh);
    ctx.fillStyle = '#6b6b6b'; ctx.fillRect(mx - mw / 2, my - mh / 2, mw, 26); // cap brim
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(mx - mw / 2, my - mh / 2 + 22, mw, 6);
    const smile = sstep(18.0, 18.6, t);
    const blink = sstep(18.65, 18.72, t) - sstep(18.78, 18.88, t);
    eyes(ctx, mx, my + 20 - smile * 3, .62, .1, Math.min(1, blink + smile * .35), 'hamid', 1);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(mx - mw / 2, my + mh / 2); ctx.lineTo(mx - mw / 2 + 120, my - mh / 2); ctx.lineTo(mx - mw / 2 + 170, my - mh / 2); ctx.lineTo(mx - mw / 2 + 50, my + mh / 2); ctx.fill();
    ctx.restore();
    ink(ctx, 3, .9); ctx.beginPath(); ctx.roundRect(mx - mw / 2, my - mh / 2, mw, mh, 22); ctx.stroke();
    // Hamid from behind: cap, shoulders; his hand rises to wipe his eye
    const wipe = sstep(17.7, 18.1, t) - sstep(18.5, 18.9, t);
    ctx.save(); ctx.translate(560, 700);
    rimShape(ctx, (k, col) => {
      k.fillStyle = col; k.beginPath();
      k.ellipse(0, 0, 100, 112, 0, 0, 7); k.fill(); // head
      k.beginPath(); k.moveTo(-112, -30); k.bezierCurveTo(-120, -90, -70, -120, 0, -122); k.bezierCurveTo(70, -120, 120, -90, 112, -30); k.closePath(); k.fill(); // cap
      k.beginPath(); k.ellipse(-102, 10, 16, 30, 0, 0, 7); k.ellipse(102, 10, 16, 30, 0, 0, 7); k.fill(); // ears
      k.beginPath(); k.moveTo(-70, 80); k.bezierCurveTo(-200, 120, -300, 200, -320, 400); k.lineTo(320, 400); k.bezierCurveTo(300, 200, 200, 120, 70, 80); k.fill(); // shoulders
      // arm + hand toward the face
      k.strokeStyle = col; k.lineCap = 'round'; k.lineJoin = 'round'; k.lineWidth = 58; k.beginPath(); k.moveTo(210, 330); k.quadraticCurveTo(250 - wipe * 10, 290 - wipe * 120, 230 - wipe * 70, 330 - wipe * 260); k.lineTo(170 - wipe * 90, 300 - wipe * 290); k.stroke();
      k.lineWidth = 40; k.beginPath(); k.moveTo(170 - wipe * 90, 300 - wipe * 290); k.lineTo(140 - wipe * 95, 290 - wipe * 300); k.stroke();
    }, '#1b1418', '#ffb87a', 6, -5, .45);
    ctx.restore();
    ctx.restore();
    if (t > 19.0) { ctx.globalAlpha = sstep(19.0, 19.3, t); finalWide(t); ctx.globalAlpha = 1; }
    return;
  }
  finalWide(t);
}
function finalWide(t) {
  ctx.save(); cam(ctx, 960, 700, 1.04 - .04 * sstep(19, 20, t));
  ctx.drawImage(A.s6bay, 0, 0);
  glow(ctx, 1350, 560, 220, '255,236,200', .9);
  rays(ctx, 1350, 560, 24, 1400, 66, '255,220,170', .05, Math.PI * 2, 0, t);
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(870, 222); ctx.lineTo(500, 360); ctx.stroke();
  plane(ctx, 880, 218, .12, -.3);
  // glitter
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; const R = rng(15);
  for (let i = 0; i < 200; i++) { const y = 615 + Math.pow(R(), 1.5) * 300, x = 1350 + (R() - .5) * (40 + (y - 600) * 1.6); const a = .6 * Math.max(0, Math.sin(t * 6 + i * 1.9)); ctx.fillStyle = `rgba(255,230,190,${a})`; ctx.fillRect(x, y, 10, 2); } ctx.restore();
  // corniche: white balustrade with arches, pavement
  ctx.fillStyle = '#e9e2d6'; ctx.fillRect(0, 860, W, 40);
  for (let i = 0; i < 28; i++) { const x = i * 72; ctx.fillStyle = '#efe8dc'; ctx.fillRect(x + 8, 900, 18, 70); ink(ctx, 1.4, .6); ctx.strokeRect(x + 8, 900, 18, 70); }
  ctx.fillStyle = '#e2dace'; ctx.fillRect(0, 970, W, 20);
  ctx.fillStyle = vgrad(ctx, 990, H, [[0, '#8a7f7a'], [1, '#5a504e']]); ctx.fillRect(0, 990, W, 90);
  ink(ctx, 2, .6); ctx.beginPath(); ctx.moveTo(0, 860); ctx.lineTo(W, 860); ctx.moveTo(0, 990); ctx.lineTo(W, 990); ctx.stroke();
  // the little yellow taxi, Hamid inside
  taxi(ctx, 640, 1040, .62, -1, { driver: true, glass: '#4d7f8f' });
  glow(ctx, 600, 960, 300, '255,200,150', .15, false);
  [[300, 400, .5, 0], [1500, 300, .7, 1]].forEach(([x, y, s, ph]) => gull(ctx, x + (t - 19) * 40, y + Math.sin(t + ph) * 8, s, t, ph));
  ctx.restore();
}

// ---------- frame ----------
let ready = false;
function bloom() {
  const s = A.bloom || (A.bloom = mk(W / 4, H / 4)); const k = s.getContext('2d');
  k.clearRect(0, 0, s.width, s.height); k.filter = 'blur(6px) brightness(1.1)'; k.drawImage(cv, 0, 0, s.width, s.height); k.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .28; ctx.drawImage(s, 0, 0, W, H); ctx.restore();
}
window.renderFrame = function (t) {
  if (!ready) { prep(); ready = true; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (t < 3) shot1(t); else if (t < 6) shot2(t); else if (t < 10) shot3(t); else if (t < 13) shot4(t); else if (t < 17) shot5(t); else shot6(t);
  bloom();
  // fade in / out
  const f = Math.max(1 - sstep(0, .5, t), sstep(19.6, 20, t));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
  return true;
};
